name: unity_kit
description: Flutter plugin for Unity 3D integration — typed bridge, binary protocol, performance + AR, on Android, iOS, web & desktop.
version: 2.0.2

homepage: https://github.com/erykkruk/flutter_unity_kit
repository: https://github.com/erykkruk/flutter_unity_kit
documentation: https://codigee.com/open-source/unity-kit

topics:
  - unity
  - flutter-unity
  - game
  - assets
  - bridge

environment:
  # Web support uses modern dart:js_interop (`isA`, package:web), which
  # requires Dart 3.4 / Flutter 3.22. Mobile-only consumers are unaffected.
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.0
  http: ^1.2.0
  path_provider: ^2.1.1
  crypto: ^3.0.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.3
  test: ^1.26.3

flutter:
  plugin:
    platforms:
      android:
        package: com.unity_kit
        pluginClass: UnityKitPlugin
      ios:
        pluginClass: SwiftUnityKitPlugin
      web:
        pluginClass: UnityKitWeb
        fileName: unity_kit_web.dart
      macos:
        pluginClass: UnityKitPlugin
      windows:
        pluginClass: UnityKitPlugin
      linux:
        pluginClass: UnityKitPlugin
