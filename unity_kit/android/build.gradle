// Groovy on purpose: on AGP 9 the Kotlin DSL rejects the android and kotlinOptions
// blocks below at script compilation, and they must stay for apps on AGP 8.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'com.unity_kit'
version = '2.2.1'

android {
    namespace = 'com.unity_kit'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.annotation:annotation:1.9.1'
    // Provided by Unity at runtime via flatDir.
    compileOnly group: '', name: 'unity-classes', ext: 'jar'

    def lifecycleProject = rootProject.findProject(':flutter_plugin_android_lifecycle')
    if (lifecycleProject != null) {
        compileOnly lifecycleProject
    }
}
